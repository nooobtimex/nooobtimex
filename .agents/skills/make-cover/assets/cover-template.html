<!doctype html>
<html lang="en">
	<meta charset="utf-8" /><title>Project cover</title>
	<style>
		* {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			background: #faf9f6;
			color: #222a35;
			font-family: Inter, Arial, sans-serif;
		}
		main {
			height: 900px;
			width: 1600px;
			padding: 94px;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
		}
		.top,
		.bottom {
			display: flex;
			justify-content: space-between;
			align-items: center;
			font-size: 26px;
			color: #58616d;
		}
		.brand {
			color: #2845ee;
			font-weight: 600;
		}
		h1 {
			max-width: 1300px;
			font-size: 100px;
			line-height: 1.08;
			letter-spacing: -4px;
			font-weight: 600;
			margin: 0 0 28px;
		}
		p {
			font-size: 34px;
			line-height: 1.5;
			max-width: 1150px;
			color: #58616d;
			margin: 0;
		}
		.bottom {
			border-top: 1px solid #dcdedc;
			padding-top: 30px;
		}
		.badge {
			font-size: 24px;
			color: #2845ee;
		}
		#tags {
			max-width: 1100px;
			font-size: 24px;
		}
	</style>
	<main>
		<div class="top"><span class="brand">NooobtimeX.</span><span id="badge" class="badge"></span></div>
		<div>
			<h1 id="title"></h1>
			<p id="subtitle"></p>
		</div>
		<div class="bottom"><span id="tags"></span><span>Selected work</span></div>
	</main>
	<script>
		const q = new URLSearchParams(location.search)
		for (const k of ['title', 'subtitle', 'tags'])
			document.getElementById(k).textContent = (q.get(k) || '').replaceAll('|', ' ').replaceAll(',', ' · ')
		document.getElementById('badge').textContent = (q.get('badgeLvl') || '').replace('●', '').trim()
	</script>
</html>
