name: README assets

# Weekly plus manual only — deliberately no `push` trigger. On push, this job's commit landed
# ~15 s after each code push, while Railway was still building it; Railway diffs against the
# last *successful* deploy, so watchPatterns did not skip the bot commit and every code push
# built twice (the first build cancelled). It also left local main behind after every push.
# Need the README cards fresh sooner? Actions → README assets → Run workflow.
on:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC (12:00 in Thailand)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run readme:assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed assets
        run: |
          if [ -n "$(git status --porcelain .github/assets)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/assets
            git commit -m 'chore(readme): refresh generated assets [skip ci]'
            git push
          else
            echo 'Assets unchanged — nothing to commit.'
          fi
