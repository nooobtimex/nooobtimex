[build]
builder = "DOCKERFILE"
# Railway: leave the service Root Directory at "/" (repo root) — the Dockerfile
# expects the repo root as its build context.
dockerfilePath = "Dockerfile"
# Allowlist, so the readme-assets workflow committing regenerated SVGs into
# .github/assets/ does not trigger a pointless site rebuild. Anything the build
# actually reads has to be listed here.
watchPatterns = [
	"app/**",
	"common/**",
	"components/**",
	"lib/**",
	"public/**",
	# The Dockerfile's gates run from here (icons, links, seo, bundle checks) — a change
	# to one of them changes what a deploy accepts, so it must trigger a rebuild.
	"scripts/**",
	# Decides what enters the build context (it is what keeps .env out of the image).
	".dockerignore",
	"next.config.ts",
	"postcss.config.mjs",
	"tsconfig.json",
	"components.json",
	"package.json",
	"bun.lock",
	"Dockerfile",
	"railway.toml"
]

[deploy]
# Matches the Dockerfile CMD. The standalone server reads Railway's injected
# $PORT itself, so no -p flag here (unlike the local `dev`/`start` scripts,
# which pin port 1000).
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
